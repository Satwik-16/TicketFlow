# =============================================================================
# Apexon AI Agent — Docker Compose Service
# =============================================================================
# Spins up PostgreSQL 16 for local development.
# All credentials are injected via environment variables — zero hardcoded secrets.
#
# Usage:
#   1. Copy .env.example to .env and fill in your values.
#   2. Run: docker compose -f dockerComposeService.yml up -d
#   3. Verify: docker compose -f dockerComposeService.yml ps
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: apexon_ai_postgres
    restart: unless-stopped

    # -------------------------------------------------------------------------
    # Credentials injected from .env — never hardcoded.
    # -------------------------------------------------------------------------
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}

    ports:
      - "${DB_PORT:-5432}:5432"

    # -------------------------------------------------------------------------
    # Persistent volume ensures data survives container restarts.
    # -------------------------------------------------------------------------
    volumes:
      - apexon_pg_data:/var/lib/postgresql/data

    # -------------------------------------------------------------------------
    # Health check ensures downstream services wait for Postgres readiness.
    # -------------------------------------------------------------------------
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  apexon_pg_data:
    driver: local
